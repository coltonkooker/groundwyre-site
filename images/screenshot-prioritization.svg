  <text x="60" y="514" font-size="12" fill="#4B5563">inspection. Segment carries 2 school bus routes (safety</text>
  <text x="60" y="532" font-size="12" fill="#4B5563">weight +1.2). Located in a federally designated equity</text>
  <text x="60" y="550" font-size="12" fill="#4B5563">tract. Cost per lane-mile is 14% below district average.</text>

