<svg width="1200" height="900" viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F8FA"/>
      <stop offset="100%" stop-color="#EEF1F4"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#13294B" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="900" rx="18" fill="url(#bgGrad)"/>

  <!-- muted map grid -->
  <g stroke="#D7DDE4" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="0" y1="750" x2="1200" y2="750"/>
    <line x1="150" y1="0" x2="150" y2="900"/>
    <line x1="350" y1="0" x2="350" y2="900"/>
    <line x1="550" y1="0" x2="550" y2="900"/>
    <line x1="750" y1="0" x2="750" y2="900"/>
    <line x1="950" y1="0" x2="950" y2="900"/>
  </g>

  <!-- road network -->
  <g fill="none" stroke-linecap="round">
    <path d="M100 700 C 300 650, 380 500, 600 480 S 900 380, 1100 250" stroke="#2C6ECB" stroke-width="7"/>
    <path d="M150 200 C 300 260, 500 260, 650 420 S 850 620, 1050 700" stroke="#C4CAD3" stroke-width="7"/>
    <path d="M250 850 C 400 780, 500 700, 620 600" stroke="#FF6B4A" stroke-width="7"/>
    <path d="M700 120 C 760 260, 820 340, 950 400" stroke="#F5A623" stroke-width="7"/>
    <path d="M80 420 C 220 430, 360 420, 480 480" stroke="#C4CAD3" stroke-width="6"/>
  </g>

  <!-- nodes -->
  <circle cx="600" cy="480" r="9" fill="#2C6ECB"/>
  <circle cx="620" cy="600" r="9" fill="#FF6B4A"/>
  <circle cx="950" cy="400" r="9" fill="#F5A623"/>
  <circle cx="1100" cy="250" r="9" fill="#2C6ECB"/>
  <circle cx="150" cy="200" r="9" fill="#C4CAD3"/>

  <!-- floating priority score card -->
  <g filter="url(#cardShadow)">
    <rect x="640" y="520" width="300" height="150" rx="14" fill="#FFFFFF"/>
  </g>
  <text x="666" y="556" font-size="12" letter-spacing="1" fill="#FF6B4A" font-weight="700">PRIORITY SCORE</text>
  <text x="666" y="586" font-size="26" fill="#13294B" font-weight="700">Elm Street — 8.7</text>
  <rect x="666" y="600" width="248" height="6" rx="3" fill="#EEF1F4"/>
  <rect x="666" y="600" width="205" height="6" rx="3" fill="#2C6ECB"/>
  <text x="666" y="628" font-size="12" fill="#6B7480">Condition · Risk · Cost · Equity</text>
  <text x="666" y="650" font-size="12" fill="#4B5563">Funded — scheduled Q2</text>

  <!-- floating engagement card -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="470" width="260" height="120" rx="14" fill="#FFFFFF"/>
  </g>
  <circle cx="150" cy="502" r="14" fill="#E7EFFB"/>
  <path d="M144 502 l4 4 l8 -9" stroke="#2C6ECB" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="176" y="500" font-size="13" fill="#13294B" font-weight="700">42 resident comments</text>
  <text x="176" y="518" font-size="11" fill="#6B7480">mapped to this project</text>
  <rect x="140" y="536" width="220" height="8" rx="4" fill="#EEF1F4"/>
  <rect x="140" y="536" width="150" height="8" rx="4" fill="#FF6B4A"/>
  <text x="140" y="565" font-size="11" fill="#6B7480">Support: 68%</text>
</svg>
